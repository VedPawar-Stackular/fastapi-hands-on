[project]
name = "fastapi-hands-on"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "black>=26.5.1",
    "fastapi>=0.138.2",
    "httpx2>=2.5.0",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.49.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src/my_app"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest-asyncio>=1.4.0",
]
